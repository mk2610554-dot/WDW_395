<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration Form</title>
    </head>
    <body>
        <h1 align="center">Student Registration Form</h1>
        <hr>

        <form method="post" action="submit.html"


        <label for="Full name">Full name:</label>
        <input type="text" id="Full name" name="Full name" placeholder="Enter your Full name" required><br><br>

        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email" placeholder="Enter Valid Email Address" required><br><br>

        <label for="Password">Password:</label>
        <input type="Password" id="Password" name="Password" placeholder="Enter Password" required><br><br>

        <label for="Gender">Gender:</label>
        <input type="radio" id="Male" value="Male" required> Male
        <input type="radio" id="Female" value="Female" required> Female
        <input type="radio" id="Others" value="Others" required> Others
        <br><br>

        <label>Course:</label>
        <select name="Course" required>
            <option value="">--Select Course--</option>
            <option value="B-Tech">B-Tech</option>
            <option value="BCA">BCA</option>
            <option value="M-Tech">M-Tech</option>
            <option value="B.A.">B.A.</option>
            <option value="MBA">MBA</option>
            <option value="ITI">ITI</option>
        </select><br><br>

        <label for="Contact">Contact no.:</label>
        <input type="tel" id="contact" name="contact" placeholder="Enter Contact Number" required><br><br>

        <label for="Address">Address:</label><br>
        <textarea id="Address" name="Address" rows="4" cols="40" placeholder="Enter your Address"required></textarea><br><br>

        <input type="submit" value="Register">
        <input type="Reset" value="Clear">
    </form>
    <hr>
    <p align="center">&copy; 2026 Students Registration Form.</p>

    </body>
</html>
